name: JalDrishti CI/CD & Model Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Lint, Selftest & Smoke Tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Compilation Validation
        run: |
          python -m py_compile app.py
          python -m py_compile src/selftest.py
          python -m py_compile tests/test_app_smoke.py

      - name: Execute System Self-Test
        run: |
          python src/selftest.py

      - name: Execute Streamlit App Smoke Tests
        run: |
          python tests/test_app_smoke.py

